<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开心养羊场</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-stage" aria-label="开心养羊场">
      <section class="scene-bg" aria-hidden="true">
        <div class="cloud cloud-left"></div>
        <div class="cloud cloud-right"></div>
        <div class="tree"></div>
        <div class="house"></div>
        <div class="hills"></div>
      </section>

      <header class="game-header">
        <div class="level-line">当前等级: <strong id="maxLevel">Lv.1</strong> 第<span id="pastureCount">0</span>只羊</div>
        <div class="wood-sign">
          <span class="gem"></span>
          <strong id="coins">100</strong>
          <strong id="income">0/秒</strong>
        </div>
      </header>

      <nav class="side-buttons" aria-label="功能按钮">
        <button type="button" data-modal="workshop">工作间</button>
        <button type="button" data-modal="quest">任务</button>
        <button type="button" data-modal="book">图鉴</button>
        <button id="feedBoost" type="button" data-testid="feed-boost">加速</button>
      </nav>

      <section id="pasture" class="pasture-grid" data-dropzone="pasture" aria-label="羊场"></section>

      <section class="bottom-shop" aria-label="购买">
        <button id="buySheep" class="buy-button" type="button" data-testid="buy-sheep">
          <span class="cart-icon">商店</span>
          <strong>快速购买</strong>
          <small>50 金币 · Lv.1</small>
        </button>
      </section>

      <section class="utility-actions" aria-label="辅助操作">
        <button id="autoMerge" type="button" data-testid="auto-merge">一键合成</button>
        <button id="collectBonus" type="button" data-testid="collect-bonus">羊毛订单</button>
        <button id="resetGame" type="button" data-testid="reset-game">重开</button>
      </section>

      <section id="toast" class="toast" role="status" aria-live="polite"></section>
    </main>

    <div id="modalBackdrop" class="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button id="closeModal" class="modal-close" type="button" aria-label="关闭">×</button>
        <h2 id="modalTitle">弹窗</h2>
        <div id="modalBody" class="modal-body"></div>
      </section>
    </div>

    <script src="./game.js"></script>
  </body>
</html>
